name: Validate requirements model

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate model
        run: python3 -m unittest discover -s tests
      - name: Check JavaScript syntax
        run: node --check app.js && node --check clarity.js
      - name: Validate backup import
        run: node --test tests/test_backup_import.js
      - name: Browser UI smoke (desktop + mobile)
        run: bash tests/ui_smoke.sh
