name: Rewrite end-product copy

on:
  push:
    branches: [fix/endproduct-copy]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/endproduct-copy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite remaining editorial copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("data/requirements.json")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "Das Dokument bezeichnet die Gliederung als verbindlich. Die Fragen in eckigen Klammern werden hier als Orientierungshinweise wiedergegeben, nicht als zusätzliche Bewertungskriterien.":
                  "Das Dokument bezeichnet die Gliederung als verbindlich. Die Fragen in eckigen Klammern dienen als Orientierungshinweise und sind keine zusätzlichen Bewertungskriterien.",
              "Die allgemeine verbindliche Gliederung wird als Basis angezeigt. Daraus wird nicht abgeleitet, dass damit alle Vorgaben der gewählten anderen Vertiefung abgedeckt sind.":
                  "Die allgemeine verbindliche Gliederung bildet die Basis. Daraus folgt nicht, dass damit alle Vorgaben der gewählten anderen Vertiefung abgedeckt sind.",
              "Der Bewertungsbogen behandelt die Einleitung als eigenen Abschnitt. Die allgemeine verbindliche Endgliederung ordnet „Einleitung und Kontext“ als 1.1 unter „Wahrnehmen und Erleben“ ein; das heilpädagogische Gliederungsblatt führt die „Einleitung“ dagegen vor Abschnitt 1 und nennt „Kontext“ innerhalb von Abschnitt 1. Die Website behält die Einleitung als eigenen Arbeitsschritt und zeigt für die Endfassung die zur gewählten Vertiefung passende Struktur.":
                  "Der Bewertungsbogen behandelt die Einleitung als eigenen Abschnitt. Die allgemeine verbindliche Endgliederung ordnet „Einleitung und Kontext“ als 1.1 unter „Wahrnehmen und Erleben“ ein; das heilpädagogische Gliederungsblatt führt die „Einleitung“ dagegen vor Abschnitt 1 und nennt „Kontext“ innerhalb von Abschnitt 1. Für den Arbeitsprozess bleibt die Einleitung ein eigener Schritt; für die Endfassung gilt die zur gewählten Vertiefung passende Struktur.",
          }
          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed += 1
          path.write_text(text, encoding="utf-8")
          print(f"Ersetzte Restformulierungen: {changed} / {len(replacements)}")

          audit_tokens = [
              "liegt nun vor",
              "erläutert jetzt",
              "aktuellen Quellenordner",
              "derzeit hinterlegten",
              "Die Website behält",
              "Die Website zeigt",
              "Die Website stellt",
              "im Repository abgelegte",
          ]
          remaining = [token for token in audit_tokens if token in text]
          if remaining:
              raise SystemExit("Verbleibende Übergangsformulierungen: " + ", ".join(remaining))
          print("Copy-Audit: keine bekannten Übergangsformulierungen mehr gefunden.")
          PY

      - name: Commit rewritten copy
        shell: bash
        run: |
          if git diff --quiet -- data/requirements.json; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/requirements.json
          git commit -m "Copy-Bereinigung vervollständigen"
          git push origin HEAD:fix/endproduct-copy
